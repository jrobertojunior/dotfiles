set -g default-terminal "screen-256color"
set -g history-limit 50000

# Add mouse support
set -g mouse on
set -g escape-time 0

# Set the prefix key to Ctrl-s
set -g prefix C-s
unbind C-b
bind C-s send-prefix

set -g base-index 1
set -g pane-base-index 1

# true color support
set -as terminal-overrides ',*:RGB'
set -g default-terminal "${TERM}"

# set -g focus events-on

# Change shortcuts for splitting split-window
bind -n M-b split-window -v -p 20 -c "#{pane_current_path}"
bind -n M-v split-window -h -p 20 -c "#{pane_current_path}"
unbind '"'
unbind %

bind -n M-d detach

# Add resize shortcuts
bind -n M-j resize-pane -D 5
bind -n M-k resize-pane -U 5
bind -n M-h resize-pane -L 5
bind -n M-l resize-pane -R 5

# Swap panes with M + arrow keys
bind -n M-Up swap-pane -U
bind -n M-Down swap-pane -D

bind -n M-f display-popup \
  -d "#{pane_current_path}"

bind -n M-g display-popup \
  -d "#{pane_current_path}" \
  -w 90% \
  -h 90% \
  -E "lazygit"

# Window management shortcuts
bind -n M-] next-window
bind -n M-[ previous-window
bind -n M-0 select-window -t 0
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Reorder windows with M-, M-., swap with previous/next and adjust focus
bind -n M-, swap-window -t -1 \; previous-window
bind -n M-. swap-window -t +1 \; next-window

# Move between panes using M + h/j/k/l
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# echo debug text
bind -n M-q display "Debug: Pane ID is #{pane_id}, Window ID is #{window_id}, Session ID is #{session_id}"

# Toggle fullscreen for the current window with M-f
# bind -n M-f resize-pane -Z \; display "Toggled fullscreen for current window"

# Go to the last window with M-tab
bind -n M-Tab next-window
bind -n M-BTab previous-window # TODO: not working

bind -n M-n new-window;
bind -n M-w kill-window
bind -n M-x kill-pane

# Shortcut for renaming the current window
bind -n M-r command-prompt "rename-window '%%'"

bind-key -n M-Left send-keys Escape b  # Move back one word
bind-key -n M-Right send-keys Escape f # Move forward one word

set -g status-left " #[fg=#80A1C1]#S "
set -g window-status-format " #W "
set -g window-status-current-format " #W "
set -g status-right-length 100
set -g status-position top
set -g status-style bg=#222630
set -g status-right " #[fg=#60718A]#{pane_current_path} #[fg=#60718A]| #[fg=#A3BE8C]#(date +'%Y-%m-%d') #[fg=#60718A]| #[fg=#A3BE8C]#(date +'%H:%M') "
set -g window-status-format " #I #W "
set -g window-status-current-style fg=#A3BE8C,bold
set -g window-status-style fg=#60728A
set -g window-status-bell-style fg=#BF616A,bold

set -g renumber-windows on
set -g pane-border-lines "single"

bind -n M-t choose-tree ""

# Reload tmux config
bind -n M-z source-file ~/dotfiles/.config/tmux/tmux.conf \;display "Reloaded tmux config"
