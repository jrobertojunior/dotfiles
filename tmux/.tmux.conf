# =============================================================================
# General
# =============================================================================

set -g default-terminal "screen-256color"
set -as terminal-overrides ',*:RGB'
set -g default-terminal "${TERM}"

set -g history-limit 50000
set -g escape-time 0
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off

# =============================================================================
# Prefix
# =============================================================================

set -g prefix C-s
unbind C-b
bind C-s send-prefix

# =============================================================================
# Sessions
# =============================================================================

bind -n M-N   new-session
bind -n M-s   choose-session
bind -n M-t   choose-tree ""
bind -n M-S   display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "tmux choose-session"
bind -n M-K   display-popup -h 90% -w 50% -E "sesh picker -i"
bind -n 'M-{' switch-client -p
bind -n 'M-}' switch-client -n

# =============================================================================
# Windows
# =============================================================================

bind -n M-n   new-window
bind -n M-w   kill-window
bind -n M-r   command-prompt "rename-window '%%'"
bind -n M-]   next-window
bind -n M-[   previous-window
bind -n M-Tab next-window
bind -n M-BTab previous-window
bind -n M-,   swap-window -t -1 \; previous-window
bind -n M-.   swap-window -t +1 \; next-window

bind -n M-0 select-window -t 0
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# =============================================================================
# Panes
# =============================================================================

bind -n M-b split-window -v -p 20 -c "#{pane_current_path}"
bind -n M-v split-window -h -p 20 -c "#{pane_current_path}"
bind -n M-x kill-pane
unbind '"'
unbind %

bind -n M-j resize-pane -D 5
bind -n M-k resize-pane -U 5
bind -n M-h resize-pane -L 5
bind -n M-l resize-pane -R 5

bind -n M-Up   swap-pane -U
bind -n M-Down swap-pane -D

# Smart pane switching with vim awareness
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\' 'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# =============================================================================
# Misc bindings
# =============================================================================

bind -n M-d     detach
bind -n M-\;    command-prompt
bind -n M-Space copy-mode
bind -n M-g     display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "lazygit"
bind -n M-f     display-popup -d "#{pane_current_path}"

bind-key -n M-Left  send-keys Escape b
bind-key -n M-Right send-keys Escape f

# =============================================================================
# Style
# =============================================================================

set -g status-position top
set -g status-style bg=#1e2029
set -g status-right-length 100

set -g status-left " #[fg=#80A1C1,bold]#S#[default] "
set -g status-right "#[fg=#4a5568] #{b:pane_current_path} #[fg=#3a4050]│#[fg=#A3BE8C] %Y-%m-%d #[fg=#3a4050]│#[fg=#A3BE8C] %H:%M "

set -g window-status-format         "#[fg=#60728A] #I #W "
set -g window-status-current-format "#[fg=#A3BE8C,bold] #I #W "
set -g window-status-current-style  fg=#A3BE8C,bold
set -g window-status-style          fg=#60728A
set -g window-status-bell-style     fg=#BF616A,bold

set -g pane-border-lines        "single"
set -g pane-border-style        fg=#2d3040
set -g pane-active-border-style fg=#A3BE8C
