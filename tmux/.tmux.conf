set -g default-terminal "screen-256color"
set -g history-limit 50000

# Add mouse support
set -g mouse on
set -g escape-time 0

# Set the prefix key to Ctrl-s
set -g prefix C-s
unbind C-b
bind C-s send-prefix

set -g base-index 1
set -g pane-base-index 1

# true color support
set -as terminal-overrides ',*:RGB'
set -g default-terminal "${TERM}"

# set -g focus events-on

# Change shortcuts for splitting split-window
bind -n M-b split-window -v -p 20 -c "#{pane_current_path}"
bind -n M-v split-window -h -p 20 -c "#{pane_current_path}"
unbind '"'
unbind %

bind -n M-d detach
bind -n M-\; command-prompt

# Add resize shortcuts
bind -n M-j resize-pane -D 5
bind -n M-k resize-pane -U 5
bind -n M-h resize-pane -L 5
bind -n M-l resize-pane -R 5

# Swap panes with M + arrow keys
bind -n M-Up swap-pane -U
bind -n M-Down swap-pane -D

bind -n M-f display-popup \
  -d "#{pane_current_path}"

bind -n M-g display-popup \
  -d "#{pane_current_path}" \
  -w 90% \
  -h 90% \
  -E "lazygit"

# Window management shortcuts
bind -n M-] next-window
bind -n M-[ previous-window
bind -n M-Tab next-window
bind -n M-BTab previous-window
bind -n M-0 select-window -t 0
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Reorder windows with M-, M-., swap with previous/next and adjust focus
bind -n M-, swap-window -t -1 \; previous-window
bind -n M-. swap-window -t +1 \; next-window

# Move between panes using M + h/j/k/l
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# echo debug text
bind -n M-q display "Debug: Pane ID is #{pane_id}, Window ID is #{window_id}, Session ID is #{session_id}"

bind -n M-n new-window

bind -n M-w kill-window
bind -n M-q kill-session
bind -n M-x kill-pane

# Shortcut for renaming the current window
bind -n M-r command-prompt "rename-window '%%'"

bind-key -n M-Left send-keys Escape b  # Move back one word
bind-key -n M-Right send-keys Escape f # Move forward one word

set -g status-left " #[fg=#80A1C1]#S "
set -g window-status-format " #W "
set -g window-status-current-format " #W "
set -g status-right-length 100
set -g status-position top
set -g status-style bg=#222630
set -g status-right " #[fg=#60718A]#{b:pane_current_path} #[fg=#60718A]| #[fg=#A3BE8C]#(date +'%Y-%m-%d') #[fg=#60718A]| #[fg=#A3BE8C]#(date +'%H:%M') "
set -g window-status-format " #I #W "
set -g window-status-current-style fg=#A3BE8C,bold
set -g window-status-style fg=#60728A
set -g window-status-bell-style fg=#BF616A,bold

set -g renumber-windows on
set -g pane-border-lines "single"

bind -n M-t choose-tree ""
bind -n M-s choose-session
bind -n M-S display-popup \
  -d "#{pane_current_path}" \
  -w 90% \
  -h 90% \
  -E "tmux choose-session"

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Toggle pane zoom with M-z
# bind -n M-z resize-pane -Z \; display "Toggled pane zoom"

# rename session
# bind -n M-R command-prompt -I "#S" "rename-session '%%'"

bind -n M-N new-session

# Previous session
bind-key -n 'M-{' switch-client -p

# Next session
bind-key -n 'M-}' switch-client -n

# vim mode (scroll mode)
bind-key -n 'M-Space' copy-mode

